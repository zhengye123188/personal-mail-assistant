name: Build desktop installers

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Installers to build
        type: choice
        default: both
        options: [both, windows, intel-mac]

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64 installer
    if: inputs.platform != 'intel-mac'
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt PySide6-WebEngine==6.12.0.140 keyring==25.7.0 PyInstaller==6.22.3
      - name: Freeze the desktop application
        run: python -m PyInstaller --noconfirm --clean packaging/windows.spec
      - name: Build the per-user installer
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          $version = (Get-Content packaging/VERSION -Raw).Trim()
          & $compiler "/DAppVersion=$version" packaging/windows.iss
      - name: Test installation, startup and removal
        shell: pwsh
        run: ./packaging/smoke_windows.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: dist/PersonalMailAssistant-Windows-x64-Setup.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  intel-mac:
    name: Intel Mac installer
    if: inputs.platform != 'windows'
    runs-on: macos-26-intel
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt PySide6-WebEngine==6.12.0.140 keyring==25.7.0 PyInstaller==6.22.3
      - name: Build and test the Intel disk image
        run: bash packaging/build_macos.sh
      - uses: actions/upload-artifact@v7
        with:
          name: macos-x86_64
          path: dist/PersonalMailAssistant-macOS-x86_64.dmg
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
