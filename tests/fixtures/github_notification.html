<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    body { margin: 0; color: #24292f; font-family: Arial, sans-serif; }
    .container { width: 100%; max-width: 540px; margin: 0 auto; border-collapse: collapse; }
    .card { padding: 24px; border: 1px solid #d0d7de; border-radius: 6px; }
    .action { display: inline-block; text-decoration: none; background-color: #1f883d;
              color: white; border-radius: 6px; font-weight: bold; padding: 8px 16px; }
    .muted { font-size: 12px; color: #57606a; }
    @media screen and (max-width: 430px) { .card { padding: 12px; } }
  </style>
</head>
<body>
  <table class="container" role="presentation" cellspacing="0" cellpadding="0" align="center">
    <tr><td class="card">
      <p class="muted">octo-example / mail-reader</p>
      <h2>Review requested on pull request #42</h2>
      <table role="presentation" cellpadding="0" cellspacing="0">
        <tr>
          <td width="36" valign="top"><img src="cid:avatar" width="28" height="28" alt="Octo"></td>
          <td><strong>Octo</strong> requested your review on <strong>Update the reader</strong>.</td>
        </tr>
      </table>
      <p><a class="action" target="_blank" href="https://github.com/octo-example/mail-reader/pull/42">View pull request</a></p>
      <p class="muted">You received this because you were requested to review.
        <a href="https://github.com/settings/notifications" style="color: #0969da">Notification settings</a>
      </p>
    </td></tr>
  </table>
</body>
</html>
